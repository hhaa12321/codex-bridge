<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101214" />
    <meta name="color-scheme" content="dark light" />
    <title>Offline · Codex Bridge</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #101214;
        color: #f4f6f5;
      }
      main {
        width: min(100%, 390px);
        padding: 30px 26px;
        border: 1px solid #343a3f;
        border-radius: 8px;
        background: #191d21;
      }
      img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #aeb7bd;
        line-height: 1.5;
      }
      a {
        min-height: 48px;
        margin-top: 24px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #67d6ad;
        color: #082118;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f4f6f5;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f2f5f3;
          color: #18211c;
        }
        main {
          border-color: #cad4ce;
          background: #fff;
        }
        p {
          color: #56645c;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon-192.png" alt="" width="44" height="44" />
      <h1>Codex Bridge is offline</h1>
      <p>Reconnect to the Bridge host to continue. Sessions and credentials are never cached.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
